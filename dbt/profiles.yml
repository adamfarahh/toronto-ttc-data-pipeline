ttc_delays:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('TTC_PG_HOST', 'localhost') }}"
      port: "{{ env_var('TTC_PG_PORT', '5432') | int }}"
      user: "{{ env_var('TTC_PG_USER', 'postgres') }}"
      password: "{{ env_var('DBT_ENV_SECRET_TTC_PASSWORD') }}"
      dbname: "{{ env_var('TTC_PG_DATABASE', 'ttc_delays') }}"
      schema: analytics
      threads: 1
